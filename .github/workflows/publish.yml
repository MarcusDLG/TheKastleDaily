name: Publish approved image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan repository for credentials
        run: bash scripts/security/gitleaks.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/kastle-venv"
          source "$RUNNER_TEMP/kastle-venv/bin/activate"
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-dev.txt
          python -m pip check
          echo "$RUNNER_TEMP/kastle-venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .


      - name: Scan Python application security
        run: |
          mkdir -p artifacts/security
          bandit -r app --ignore-nosec -f json \
            -o artifacts/security/bandit.json

      - name: Regression tests
        run: python -m pytest --junitxml=artifacts/junit.xml

      - name: Build and validate a fixture EPUB
        run: bash scripts/epub/acceptance.sh

      - name: Audit production dependencies
        run: pip-audit --require-hashes -r requirements.txt

      - name: Audit development dependencies
        run: pip-audit --require-hashes -r requirements-dev.txt

      - name: PostgreSQL integration and migration regression
        run: bash scripts/database/acceptance.sh

      - name: Validate Docker Compose
        run: POSTGRES_PASSWORD=ci-only-placeholder docker compose config --quiet

      - name: Validate AMD64 production build
        run: docker build --platform linux/amd64 -t kastle-daily:validation .

      - name: Scan container vulnerabilities
        run: bash scripts/security/trivy.sh kastle-daily:validation

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-security-results
          path: artifacts/
          retention-days: 14

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: approved-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/kastle-venv"
          source "$RUNNER_TEMP/kastle-venv/bin/activate"
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-dev.txt
          python -m pip check
          echo "$RUNNER_TEMP/kastle-venv/bin" >> "$GITHUB_PATH"

      - name: Build and scan release image
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$image" .
          bash scripts/security/trivy.sh "$image"

      - name: Push scanned commit tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published-image-security-results
          path: artifacts/
          retention-days: 14
