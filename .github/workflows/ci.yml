name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan repository for credentials
        run: bash scripts/security/gitleaks.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/kastle-venv"
          source "$RUNNER_TEMP/kastle-venv/bin/activate"
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-dev.txt
          python -m pip check
          echo "$RUNNER_TEMP/kastle-venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .


      - name: Scan Python application security
        run: |
          mkdir -p artifacts/security
          bandit -r app --ignore-nosec -f json \
            -o artifacts/security/bandit.json

      - name: Regression tests
        run: python -m pytest --junitxml=artifacts/junit.xml

      - name: Audit production dependencies
        run: pip-audit --require-hashes -r requirements.txt

      - name: Audit development dependencies
        run: pip-audit --require-hashes -r requirements-dev.txt

      - name: PostgreSQL integration and migration regression
        run: bash scripts/database/acceptance.sh

      - name: Validate Docker Compose
        run: POSTGRES_PASSWORD=ci-only-placeholder docker compose config --quiet

      - name: Build AMD64 production image
        run: docker build --platform linux/amd64 -t kastle-daily:ci .

      - name: Scan container vulnerabilities
        run: bash scripts/security/trivy.sh kastle-daily:ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regression-results
          path: artifacts/
          retention-days: 14
