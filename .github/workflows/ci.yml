name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest --junitxml=artifacts/junit.xml
      - run: pip-audit -r requirements.txt
      - run: POSTGRES_PASSWORD=ci-only-placeholder docker compose config --quiet
      - run: docker build --platform linux/amd64 -t kastle-daily:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: artifacts/
