name: kastle-daily
services:
  api:
    build: .
    image: kastle-daily:dev
    ports:
      - "127.0.0.1:8765:8000"
    networks: [frontend]
    mem_limit: 512m
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kastle_daily
      POSTGRES_USER: kastle_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kastle_bootstrap -d kastle_daily"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  frontend: {}
  database:
    internal: true
volumes:
  pgdata: {}
