name: kastle-daily
services:
  api:
    build: .
    image: kastle-daily:dev
    ports:
      - "127.0.0.1:8765:8000"
    networks: [frontend]
    mem_limit: 512m
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment:
      POSTGRES_DB: kastle_daily
      POSTGRES_USER: kastle_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -w -v ON_ERROR_STOP=1 -tAc "SELECT 1" >/dev/null'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  frontend: {}
  database:
    internal: true
volumes:
  pgdata: {}
