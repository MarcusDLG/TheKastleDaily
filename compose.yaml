name: kastle-daily
services:
  worker:
    build: .
    image: ${KASTLE_APP_IMAGE:-kastle-daily:dev}
    command: [python, -m, app.schedule]
    volumes:
      - kastle-data:/data
    environment:
      KASTLE_DB: /data/kastle.db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KINDLE_ADDRESS: ${KINDLE_ADDRESS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_MAX_COST_USD: ${OPENAI_MAX_COST_USD:-}
      OPENAI_INPUT_COST_PER_MTOK: ${OPENAI_INPUT_COST_PER_MTOK:-}
      OPENAI_OUTPUT_COST_PER_MTOK: ${OPENAI_OUTPUT_COST_PER_MTOK:-}
      SECRETS_BACKEND: ${SECRETS_BACKEND:-}
      SECRETS_PREFIX: ${SECRETS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    mem_limit: 1g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      # The scheduler rewrites run-state.json on every wake (15 minutes).
      test: [CMD, python, -m, app.health]
      interval: 15m
      timeout: 5s
      retries: 3
      start_period: 60s
  admin:
    build: .
    image: ${KASTLE_APP_IMAGE:-kastle-daily:dev}
    command: [python, -m, app.admin]
    profiles: [admin]
    volumes:
      - kastle-data:/data
    environment:
      KASTLE_DB: /data/kastle.db
      ADMIN_PORT: "8080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    healthcheck:
      # The server binds the container's own interface, not loopback.
      test: [CMD, python, -c, "import socket,urllib.request; urllib.request.urlopen('http://%s:8080/healthz' % socket.gethostbyname(socket.gethostname()), timeout=3)"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  kastle-data: {}
