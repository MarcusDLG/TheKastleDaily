name: kastle-daily
services:
  worker:
    build: .
    image: ${KASTLE_APP_IMAGE:-kastle-daily:dev}
    command: [python, -m, app.schedule]
    volumes:
      - kastle-data:/data
    environment:
      KASTLE_DB: /data/kastle.db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KINDLE_ADDRESS: ${KINDLE_ADDRESS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_MAX_COST_USD: ${OPENAI_MAX_COST_USD:-}
      OPENAI_INPUT_COST_PER_MTOK: ${OPENAI_INPUT_COST_PER_MTOK:-}
      OPENAI_OUTPUT_COST_PER_MTOK: ${OPENAI_OUTPUT_COST_PER_MTOK:-}
    mem_limit: 1g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      # The scheduler rewrites run-state.json on every wake (15 minutes).
      test: [CMD, python, -m, app.health]
      interval: 15m
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  kastle-data: {}
